name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the newest NumPy/SciPy/Matplotlib releases, so that an
    # upstream API change is noticed before users run into it.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install the package (not editable) and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run the test suite against the installed package
        run: python -m pytest --cov=polarmap --cov-report=term-missing

  minimum-versions:
    name: Oldest supported NumPy / SciPy / Matplotlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the lower bounds declared in pyproject.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.23.5" "scipy==1.9.3" "matplotlib==3.6.3"
          python -m pip install ".[test]"
          python -c "import numpy, scipy, matplotlib; print(numpy.__version__, scipy.__version__, matplotlib.__version__)"
      - run: python -m pytest

  example-data:
    name: Example data and notebooks (with HyperSpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[io,test]" nbmake ipykernel
      - name: Tests on the example DM4 files
        run: python -m pytest -m hyperspy -v
      - name: Execute every example notebook
        run: python -m pytest --nbmake --nbmake-timeout=900 examples/
