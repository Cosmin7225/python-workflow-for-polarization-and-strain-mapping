name: release

# Builds the source distribution and wheel for every published GitHub release
# and uploads them to PyPI with "trusted publishing" (no API token is stored).
# One-time setup on https://pypi.org -> "Publishing" -> add a pending publisher:
#   project name: polarmap, owner: Cosmin7225,
#   repository: python-workflow-for-polarization-and-strain-mapping,
#   workflow: release.yml, environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polarmap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
