# Conda environment for polarmap (conda-forge packages + the package itself).
#
#   conda env create -f environment.yml
#   conda activate polarmap
#
# Run the command from the repository root: the last line installs this
# checkout in editable mode.
name: polarmap
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.23
  - scipy>=1.9
  - matplotlib>=3.6
  - hyperspy>=1.7          # reading dm3/dm4/emd files
  - colorcet               # optional cyclic colour map
  - jupyterlab
  - pytest
  - pip
  - pip:
      - -e .
